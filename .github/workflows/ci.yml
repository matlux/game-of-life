name: Test both runtimes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: lein
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: 2.12.0
      - run: lein test
      - name: Render the desktop application
        run: timeout 60s xvfb-run -a lein desktop-smoke
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: lein
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: 2.12.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: lein web-build
      - run: lein cljs-test-build
      - run: node target/cljs-tests.js
      - run: npm run test:workers
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: game-of-life-site
          path: target/site/
          include-hidden-files: true
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
